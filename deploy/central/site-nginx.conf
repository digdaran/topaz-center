# Public site (container "site"): static files from ../../site. TLS, compression and security headers are Caddy's.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    charset utf-8;
    access_log off;   # Caddy keeps the access log

    location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
    location ~* \.html$ { add_header Cache-Control "no-cache"; }
    # Fonts and screenshots change rarely; css/js revalidate (no build step, no hashed names).
    location /fonts/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /img/ { add_header Cache-Control "public, max-age=86400"; }
    location ~* \.(css|js|svg)$ { add_header Cache-Control "no-cache"; }
    # No directory listings, no dot files (.git etc. if ever copied).
    location ~ /\. { return 404; }

    error_page 404 /index.html;
}
