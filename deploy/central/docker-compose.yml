# Central service: Caddy (HTTPS, Let's Encrypt) -> central API -> PostgreSQL.
# Only Caddy publishes ports. Usage: see deploy/central/README.md
name: topaz

# Every container rotates its log: without it a crash-looping service fills the disk.
x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: topaz
      POSTGRES_USER: topaz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U topaz -d topaz"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb
    logging: *logging

  central:
    image: ${CENTRAL_IMAGE:-topaz-central:latest}
    build:
      context: ../..
      dockerfile: src/Topaz.Central/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=topaz;Username=topaz;Password=${POSTGRES_PASSWORD};Maximum Pool Size=50"
      Topaz__AdminToken: ${TOPAZ_ADMIN_TOKEN:?set TOPAZ_ADMIN_TOKEN in .env}
      Topaz__RawRetentionDays: ${TOPAZ_RAW_RETENTION_DAYS:-90}
      Topaz__StationSilentMinutes: ${TOPAZ_STATION_SILENT_MINUTES:-15}
      Topaz__KeysDirectory: /keys
      Topaz__BootstrapOwnerLogin: ${TOPAZ_BOOTSTRAP_OWNER_LOGIN:-}
      Topaz__BootstrapOwnerPassword: ${TOPAZ_BOOTSTRAP_OWNER_PASSWORD:-}
      Topaz__TelegramBotToken: ${TOPAZ_TELEGRAM_BOT_TOKEN:-}
    volumes:
      - keys:/keys   # cookie encryption keys: sessions survive restarts
    networks: [backend, frontend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on: [central]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env (Let's Encrypt account)}
      TOPAZ_ADMIN_ALLOW_IPS: ${TOPAZ_ADMIN_ALLOW_IPS:-127.0.0.1/32}   # admin/export API from these IPs only
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./logs/caddy:/var/log/caddy   # access log read by fail2ban on the host
    networks: [frontend]
    logging: *logging

  # Daily logical backup; the newest TOPAZ_BACKUP_KEEP (3) dumps are kept. A dump needs about as much
  # free space as the previous one: old dumps are removed first, and the backup is skipped (not the disk
  # filled) when there is still not enough room. Copy ./backups off the server (rsync/rclone) as well.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      KEEP: ${TOPAZ_BACKUP_KEEP:-3}
    volumes:
      - ./backups:/backups
    networks: [backend]
    logging: *logging
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        prune() { ls -1t /backups/topaz-*.dump 2>/dev/null | tail -n +$$(($$1 + 1)) | xargs -r rm -f; }
        while true; do
          rm -f /backups/*.dump.tmp
          keep=$$((KEEP > 1 ? KEEP - 1 : 1))
          prune $$keep
          last=$$(ls -1t /backups/topaz-*.dump 2>/dev/null | head -1)
          size=0; [ -n "$$last" ] && size=$$(du -k "$$last" | cut -f1)
          need=$$((size * 3 / 2 + 524288))   # KB: last dump + 50% growth + 512 MB left for the database
          free=$$(df -Pk /backups | awk 'NR==2{print $$4}')
          f=/backups/topaz-$$(date +%Y%m%d-%H%M).dump
          if [ "$$free" -lt "$$need" ]; then
            echo "backup SKIPPED: only $$((free / 1024)) MB free, need $$((need / 1024)) MB"
          elif pg_dump -h postgres -U topaz -d topaz -Fc -f "$$f.tmp" && mv "$$f.tmp" "$$f"; then
            echo "backup $$f done"
            prune $$KEEP
          else
            rm -f "$$f.tmp"; echo "backup FAILED"
          fi
          sleep 86400
        done

  # Optional: docker compose --profile monitoring up -d
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: [monitoring]
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus
    networks: [frontend]
    ports:
      - "127.0.0.1:9090:9090"   # reach via SSH tunnel only

networks:
  backend:
    internal: true   # PostgreSQL has no route to the outside world
  frontend: {}

volumes:
  keys: {}
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
  prometheus: {}
