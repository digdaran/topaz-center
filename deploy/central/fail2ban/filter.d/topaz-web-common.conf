# Shared parts of the topaz-web-* filters (Caddy JSON access log).
# Requests of station agents (User-Agent TopazAgent/...) never count: a banned
# station stops sending data, and agents legitimately get 401/409/429 at times.

[Definition]
_caddy_req = \{"level":"\w+",.*"request":\{"remote_ip":"<HOST>",.*
ignoreregex = "User-Agent":\["TopazAgent/
datepattern = "ts":{EPOCH}
