# Requests for files that do not exist in Topaz Center: vulnerability scanners
# looking for secrets (.env, .git), PHP apps, WordPress, admin panels.
# Matched by path, not by status: the SPA answers some of them with 200.
# /api/v1/* never counts (agent update packages are .zip files there).
# Input: Caddy JSON access log (deploy/central/Caddyfile).

[INCLUDES]
before = topaz-web-common.conf

[Definition]
failregex = ^%(_caddy_req)s"uri":"(?!/api/v1/)(?i:[^"]*(?:/\.env|/\.git/|/\.svn/|/\.hg/|/\.aws/|/\.ssh/|/\.vscode/|/\.ds_store|\.php\d?(?:[/?"]|$)|\.aspx?(?:[/?"]|$)|\.jsp(?:[/?"]|$)|\.cgi(?:[/?"]|$)|/wp-|/wordpress|/xmlrpc|/cgi-bin/|/phpmyadmin|/pma/|/vendor/|/actuator|/boaform|/hnap1|/owa/|/ecp/|/server-status|/solr/|/telescope|/_ignition|/console/|/\.well-known/security\.txt\.bak|\.sql(?:\.gz|\.zip)?(?:[?"]|$)|\.bak(?:[?"]|$)|\.old(?:[?"]|$)|\.zip(?:[?"]|$)|\.tar\.gz(?:[?"]|$)))
