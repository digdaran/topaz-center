# Topaz Center: fail2ban jails. Installed by deploy/central/fail2ban/install.sh;
# own addresses and station IPs (ignoreip) live only on the server in
# /etc/fail2ban/jail.d/zz-topaz-local.conf.
#
# Ports 80/443 are published by Docker: that traffic goes through FORWARD, not
# INPUT, so web bans go into the DOCKER-USER chain (ufw does not see it either).

[DEFAULT]
bantime = 1h
bantime.increment = true
bantime.maxtime = 1w
findtime = 10m
maxretry = 5
banaction = iptables-multiport
banaction_allports = iptables-allports

[sshd]
enabled = true
mode = aggressive
backend = auto
logpath = /var/log/auth.log
port = ssh

[topaz-web-probe]
enabled = true
filter = topaz-web-probe
logpath = @CADDY_LOG@
backend = auto
maxretry = 3
findtime = 1h
bantime = 1d
action = iptables-allports[name=topaz-web-probe, chain=DOCKER-USER]

[topaz-web-login]
enabled = true
filter = topaz-web-login
logpath = @CADDY_LOG@
backend = auto
maxretry = 10
findtime = 10m
action = iptables-allports[name=topaz-web-login, chain=DOCKER-USER]

[topaz-web-4xx]
enabled = true
filter = topaz-web-4xx
logpath = @CADDY_LOG@
backend = auto
maxretry = 60
findtime = 10m
action = iptables-allports[name=topaz-web-4xx, chain=DOCKER-USER]

# Repeat offenders of any jail: a week, everywhere (host and containers).
[recidive]
enabled = true
logpath = /var/log/fail2ban.log
backend = auto
maxretry = 5
findtime = 1d
bantime = 1w
action = iptables-allports[name=recidive, chain=INPUT]
         iptables-allports[name=recidive-docker, chain=DOCKER-USER]
