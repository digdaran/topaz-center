# Topaz Center: SSH hardening, installed by deploy/central/setup.sh into /etc/ssh/sshd_config.d/.
# Files there are read in name order and the first value wins, so this overrides the hosting's 40-*.conf.
# Password login is already off (10-topaz-no-password.conf); root may log in with a key only.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
X11Forwarding no
AllowAgentForwarding no
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
