groups:
  - name: topaz
    rules:
      - alert: TopazStationSilent
        expr: topaz_station_silent_seconds > 900
        for: 5m
        annotations:
          summary: "АЗС {{ $labels.station }} не выходит на связь более 15 минут"
      - alert: TopazAgentQueueGrowing
        expr: topaz_station_agent_queue_pending > 100
        for: 30m
        annotations:
          summary: "АЗС {{ $labels.station }}: очередь агента {{ $value }} пакетов"
      - alert: TopazAgentDeadLetters
        expr: topaz_station_agent_queue_dead > 0
        annotations:
          summary: "АЗС {{ $labels.station }}: сервер отклонил пакеты (status на агенте)"
      - alert: TopazProcessingFailed
        expr: topaz_raw_batches_failed > 0
        annotations:
          summary: "Есть пакеты, которые сервер не смог обработать (GET /api/v1/admin/batches)"
      - alert: TopazProcessingBacklog
        expr: topaz_raw_batches_backlog > 500
        for: 15m
        annotations:
          summary: "Очередь обработки на сервере растёт"
