name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      firebird:
        image: jacobalberty/firebird:2.5-ss
        env:
          ISC_PASSWORD: ci
        ports: ["3050:3050"]
    env:
      TOPAZ_TEST_PG: Host=localhost;Username=postgres;Password=ci;Database=postgres
      TOPAZ_TEST_FB_HOST: localhost
      TOPAZ_TEST_FB_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Wait for Firebird
        run: for _ in $(seq 1 30); do (echo > /dev/tcp/localhost/3050) 2>/dev/null && break; sleep 2; done
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  agent-package:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, win-x86]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained single-file agent
        id: pub
        run: |
          VERSION=${GITHUB_REF_NAME#v}; [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION=1.0.0-ci.${GITHUB_RUN_NUMBER}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          dotnet publish src/Topaz.Agent -c Release -r ${{ matrix.rid }} --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none -p:Version="$VERSION" -o out/TopazAgent
          cp deploy/agent/install.ps1 deploy/agent/uninstall.ps1 deploy/agent/README.md out/TopazAgent/
      - name: Check package contents
        run: |
          set -e
          for f in TopazAgent.exe appsettings.json datasets.json install.ps1 uninstall.ps1; do test -f "out/TopazAgent/$f" || { echo "missing $f"; exit 1; }; done
          # secret columns must stay excluded (also asserted by a unit test)
          jq -e '[.datasets[] | select(.table=="sysUsers")][0].exclude | index("PswHash") and index("Psw") and index("SecurityData")' out/TopazAgent/datasets.json
          jq -e '[.datasets[] | select(.table=="dcAgents")][0].exclude | index("Password")' out/TopazAgent/datasets.json
          jq -e '[.datasets[] | select(.table=="dcPaymentModes")][0].exclude | index("Config")' out/TopazAgent/datasets.json
      - name: Zip
        run: |
          NAME=TopazAgent-${{ steps.pub.outputs.version }}-${{ matrix.rid }}
          mkdir -p dist && mv out/TopazAgent "out/$NAME"
          (cd out && zip -9 -r "../dist/$NAME.zip" "$NAME")
          mv "out/$NAME" out/TopazAgent
      - uses: actions/upload-artifact@v4
        with:
          name: TopazAgent-${{ matrix.rid }}
          path: out/TopazAgent
      - uses: actions/upload-artifact@v4
        with:
          name: agent-zip-${{ matrix.rid }}
          path: dist/*.zip
      # Self-update package: manifest signed with the key whose public half is built into the agent
      # (src/Topaz.Agent/Updating/UpdateKeys.cs). Servers offer only signed packages; agents verify the signature.
      - name: Sign update manifest
        env:
          AGENT_SIGNING_KEY: ${{ secrets.AGENT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          V=${{ steps.pub.outputs.version }}; RID=${{ matrix.rid }}; NAME=TopazAgent-$V-$RID
          D=updates/$V/$RID; mkdir -p "$D"; cp "dist/$NAME.zip" "$D/"
          SHA=$(sha256sum "$D/$NAME.zip" | cut -d' ' -f1); SIZE=$(stat -c%s "$D/$NAME.zip")
          printf '{"version":"%s","rid":"%s","file":"%s","sha256":"%s","size":%s}' "$V" "$RID" "$NAME.zip" "$SHA" "$SIZE" > "$D/manifest.json"
          if [ -z "$AGENT_SIGNING_KEY" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then echo "::error::AGENT_SIGNING_KEY is not set: release packages must be signed"; exit 1; fi
            echo "::warning::AGENT_SIGNING_KEY is not set: package not signed, servers will not offer it"; exit 0
          fi
          umask 077; printf '%s\n' "$AGENT_SIGNING_KEY" > key.pem
          sed -n '/BEGIN PUBLIC KEY/,/END PUBLIC KEY/p' src/Topaz.Agent/Updating/UpdateKeys.cs | sed 's/^ *//' > builtin.pub
          openssl pkey -in key.pem -pubout | cmp -s - builtin.pub || { echo "::error::signing key does not match the key built into the agent"; rm -f key.pem; exit 1; }
          openssl dgst -sha256 -sign key.pem -out "$D/manifest.sig" "$D/manifest.json"
          rm -f key.pem
          openssl dgst -sha256 -verify builtin.pub -signature "$D/manifest.sig" "$D/manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-update-${{ matrix.rid }}
          path: updates

  central-image:
    needs: [test, web, agent-package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Signed agent packages go into the image: agents update from their own server.
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-update-*
          merge-multiple: true
          path: agent-updates
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V=${GITHUB_REF_NAME#v}; else V=1.0.0-ci.${GITHUB_RUN_NUMBER}; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/topaz-central" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Topaz.Central/Dockerfile
          build-args: VERSION=${{ steps.meta.outputs.version }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, web, agent-package, central-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-zip-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-update-*
          merge-multiple: true
          path: upd
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          V=${GITHUB_REF_NAME#v}
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/topaz-central:$V
          for m in upd/*/*/manifest.json; do
            RID=$(basename "$(dirname "$m")")
            cp "$m" "dist/TopazAgent-$V-$RID.manifest.json"
            cp "$(dirname "$m")/manifest.sig" "dist/TopazAgent-$V-$RID.manifest.sig"
          done
          cd dist
          sha256sum TopazAgent-*.zip > SHA256SUMS.txt
          cat > notes.md <<EOF
          ## Агент АЗС (Windows)

          | Файл | Для |
          |---|---|
          | \`TopazAgent-$V-win-x64.zip\` | Windows 10/11, Server 2016+ (64-бит) — обычно нужен этот |
          | \`TopazAgent-$V-win-x86.zip\` | 32-битная Windows 10 |

          .NET устанавливать не нужно. Windows 7 не поддерживается. Начиная с 1.2 агент обновляется сам с вашего сервера (раздел «АЗС → Обновление агентов»); \`*.manifest.json\`/\`*.manifest.sig\` — подписанные описания пакетов для автообновления.

          1. Скачайте архив, распакуйте, откройте PowerShell **от имени администратора** в распакованной папке.
          2. Выполните:
          \`\`\`powershell
          Get-ChildItem -Recurse | Unblock-File
          Set-ExecutionPolicy -Scope Process Bypass
          .\\install.ps1 -StationName "АЗС-5 Северная" -EnrollmentKey <ключ>
          \`\`\`
          Сервер по умолчанию — \`https://topaz.08u.ru\` (другой: \`-ServerUrl\`), пароль Firebird — стандартный пароль Топаза (другой: \`-FirebirdPassword\`; если не подойдёт, установщик спросит).
          База Топаза ищется в \`C:\\Program Files (x86)\\TopazAZS-*\`; если её там нет, установщик спросит путь.
          Подробно: [deploy/agent/README.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/deploy/agent/README.md). Контрольные суммы — в \`SHA256SUMS.txt\`.

          ## Сервер

          Образ: \`$IMAGE\` (\`CENTRAL_IMAGE=$IMAGE\` в \`.env\`, затем \`docker compose up -d\`).
          EOF
          FLAGS=(); [[ "$V" == *-* ]] && FLAGS+=(--prerelease)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" TopazAgent-* SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" TopazAgent-* SHA256SUMS.txt --verify-tag --title "Topaz Agent $V" \
              --notes-file notes.md --generate-notes "${FLAGS[@]}"
          fi
