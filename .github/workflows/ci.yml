name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      firebird:
        image: jacobalberty/firebird:2.5-ss
        env:
          ISC_PASSWORD: ci
        ports: ["3050:3050"]
    env:
      TOPAZ_TEST_PG: Host=localhost;Username=postgres;Password=ci;Database=postgres
      TOPAZ_TEST_FB_HOST: localhost
      TOPAZ_TEST_FB_PASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Wait for Firebird
        run: for _ in $(seq 1 30); do (echo > /dev/tcp/localhost/3050) 2>/dev/null && break; sleep 2; done
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Release notes cover the tagged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=${GITHUB_REF_NAME#v}
          grep -qE "^## ${V//./\\.}( |$)" src/help/changelog.md || { echo "::error::web/src/help/changelog.md has no entry '## $V — DD.MM.YYYY' (Помощь → Что нового)"; exit 1; }

  # The agent is rebuilt only when it changed: a new agent version makes every station update itself.
  # A release that touches only the server/web carries the previous release's signed agent package as is,
  # so agents see no newer version. Force a rebuild with "[agent]" in the tag message.
  agent-version:
    runs-on: ubuntu-latest
    outputs:
      rebuild: ${{ steps.v.outputs.rebuild }}
      version: ${{ steps.v.outputs.version }}
      from: ${{ steps.v.outputs.from }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out() { printf 'rebuild=%s\nversion=%s\nfrom=%s\n' "$1" "$2" "${3:-}" | tee -a "$GITHUB_OUTPUT"; }
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then out true "1.0.0-ci.${GITHUB_RUN_NUMBER}"; exit 0; fi
          V=${GITHUB_REF_NAME#v}
          PREV=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          if [[ -z "$PREV" ]]; then out true "$V"; exit 0; fi
          if git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | grep -qF '[agent]'; then echo "forced by [agent] in the tag message"; out true "$V"; exit 0; fi
          if ! git diff --quiet "$PREV" HEAD -- src/Topaz.Agent src/Topaz.Contracts Directory.Build.props Directory.Packages.props global.json; then
            git diff --stat "$PREV" HEAD -- src/Topaz.Agent src/Topaz.Contracts Directory.Build.props Directory.Packages.props global.json
            out true "$V"; exit 0
          fi
          AV=$(gh release view "$PREV" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null \
            | sed -n 's/^TopazAgent-Setup-\(.*\)-win-x64\.exe$/\1/p' | head -1 || true)
          if [[ -z "$AV" ]]; then echo "::warning::release $PREV has no agent package: rebuilding the agent"; out true "$V"; exit 0; fi
          echo "agent unchanged since $PREV: shipping agent $AV again"
          out false "$AV" "$PREV"

  agent-package:
    needs: [test, agent-version]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, win-x86]
    env:
      REBUILD: ${{ needs.agent-version.outputs.rebuild }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        if: env.REBUILD == 'true'
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained single-file agent
        id: pub
        if: env.REBUILD == 'true'
        run: |
          VERSION=${{ needs.agent-version.outputs.version }}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # The Windows build: agent + one-file setup window (net8.0-windows, WinForms).
          dotnet publish src/Topaz.Agent -c Release -f net8.0-windows -r ${{ matrix.rid }} --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none -p:Version="$VERSION" -o out/TopazAgent
          ls -la out/TopazAgent
      # Unchanged agent: the previous release's files byte for byte (same signed manifest), checked again here.
      - name: Previous agent package
        if: env.REBUILD == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V=${{ needs.agent-version.outputs.version }}; RID=${{ matrix.rid }}; NAME=TopazAgent-$V-$RID
          gh release download "${{ needs.agent-version.outputs.from }}" --repo "$GITHUB_REPOSITORY" --dir prev \
            -p "TopazAgent-Setup-$V-$RID.exe" -p "$NAME.zip" -p "$NAME.manifest.json" -p "$NAME.manifest.sig"
          mkdir -p dist setup "updates/$V/$RID" out
          cp "prev/TopazAgent-Setup-$V-$RID.exe" setup/
          cp "prev/$NAME.zip" dist/
          cp "prev/$NAME.zip" "updates/$V/$RID/"
          cp "prev/$NAME.manifest.json" "updates/$V/$RID/manifest.json"
          cp "prev/$NAME.manifest.sig" "updates/$V/$RID/manifest.sig"
          D=updates/$V/$RID
          jq -e --arg v "$V" --arg r "$RID" --arg f "$NAME.zip" '.version == $v and .rid == $r and .file == $f' "$D/manifest.json"
          [ "$(jq -r .sha256 "$D/manifest.json")" = "$(sha256sum "$D/$NAME.zip" | cut -d' ' -f1)" ] || { echo "::error::sha256 mismatch"; exit 1; }
          [ "$(jq -r .size "$D/manifest.json")" = "$(stat -c%s "$D/$NAME.zip")" ] || { echo "::error::size mismatch"; exit 1; }
          sed -n '/BEGIN PUBLIC KEY/,/END PUBLIC KEY/p' src/Topaz.Agent/Updating/UpdateKeys.cs | sed 's/^ *//' > builtin.pub
          openssl dgst -sha256 -verify builtin.pub -signature "$D/manifest.sig" "$D/manifest.json"
          (cd out && unzip -q "../dist/$NAME.zip" && mv "$NAME" TopazAgent)
          ls -la setup dist "$D"
      - name: Check package contents
        run: |
          set -e
          for f in TopazAgent.exe appsettings.json datasets.json; do test -f "out/TopazAgent/$f" || { echo "missing $f"; exit 1; }; done
          # secret columns must stay excluded (also asserted by a unit test)
          jq -e '[.datasets[] | select(.table=="sysUsers")][0].exclude | index("PswHash") and index("Psw") and index("SecurityData")' out/TopazAgent/datasets.json
          jq -e '[.datasets[] | select(.table=="dcAgents")][0].exclude | index("Password")' out/TopazAgent/datasets.json
          jq -e '[.datasets[] | select(.table=="dcPaymentModes")][0].exclude | index("Config")' out/TopazAgent/datasets.json
      # People download the setup exe; the zip is the self-update package (exe + catalog), signed below.
      - name: Setup exe and update zip
        if: env.REBUILD == 'true'
        run: |
          V=${{ steps.pub.outputs.version }}; RID=${{ matrix.rid }}
          mkdir -p dist setup
          cp out/TopazAgent/TopazAgent.exe "setup/TopazAgent-Setup-$V-$RID.exe"
          NAME=TopazAgent-$V-$RID
          mkdir -p "out/$NAME" && cp out/TopazAgent/TopazAgent.exe out/TopazAgent/datasets.json out/TopazAgent/appsettings.json "out/$NAME/"
          (cd out && zip -9 -r "../dist/$NAME.zip" "$NAME")
          ls -la setup dist
      - uses: actions/upload-artifact@v4
        if: env.REBUILD == 'true'
        with:
          name: TopazAgent-${{ matrix.rid }}
          path: out/TopazAgent
      - uses: actions/upload-artifact@v4
        with:
          name: agent-zip-${{ matrix.rid }}
          path: dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: agent-setup-${{ matrix.rid }}
          path: setup/*.exe
      # Self-update package: manifest signed with the key whose public half is built into the agent
      # (src/Topaz.Agent/Updating/UpdateKeys.cs). Servers offer only signed packages; agents verify the signature.
      - name: Sign update manifest
        if: env.REBUILD == 'true'
        env:
          AGENT_SIGNING_KEY: ${{ secrets.AGENT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          V=${{ steps.pub.outputs.version }}; RID=${{ matrix.rid }}; NAME=TopazAgent-$V-$RID
          D=updates/$V/$RID; mkdir -p "$D"; cp "dist/$NAME.zip" "$D/"
          SHA=$(sha256sum "$D/$NAME.zip" | cut -d' ' -f1); SIZE=$(stat -c%s "$D/$NAME.zip")
          printf '{"version":"%s","rid":"%s","file":"%s","sha256":"%s","size":%s}' "$V" "$RID" "$NAME.zip" "$SHA" "$SIZE" > "$D/manifest.json"
          if [ -z "$AGENT_SIGNING_KEY" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then echo "::error::AGENT_SIGNING_KEY is not set: release packages must be signed"; exit 1; fi
            echo "::warning::AGENT_SIGNING_KEY is not set: package not signed, servers will not offer it"; exit 0
          fi
          umask 077; printf '%s\n' "$AGENT_SIGNING_KEY" > key.pem
          sed -n '/BEGIN PUBLIC KEY/,/END PUBLIC KEY/p' src/Topaz.Agent/Updating/UpdateKeys.cs | sed 's/^ *//' > builtin.pub
          openssl pkey -in key.pem -pubout | cmp -s - builtin.pub || { echo "::error::signing key does not match the key built into the agent"; rm -f key.pem; exit 1; }
          openssl dgst -sha256 -sign key.pem -out "$D/manifest.sig" "$D/manifest.json"
          rm -f key.pem
          openssl dgst -sha256 -verify builtin.pub -signature "$D/manifest.sig" "$D/manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-update-${{ matrix.rid }}
          path: updates

  # The real thing on Windows: silent install, update, uninstall of the one-file setup, plus pictures of its window.
  agent-windows:
    needs: agent-package
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Agent unit tests on Windows (DPAPI, paths)
        run: dotnet test tests/Topaz.Agent.Tests -c Release
      - uses: actions/download-artifact@v4
        with:
          name: agent-setup-win-x64
          path: setup
      - name: Silent install, update, uninstall
        run: |
          $ErrorActionPreference = "Stop"
          $setup = (Get-ChildItem setup\*.exe)[0].FullName
          Write-Host "Setup: $setup ($([math]::Round((Get-Item $setup).Length / 1MB, 1)) MB)"
          New-Item -ItemType Directory -Force C:\TopazTest | Out-Null
          Set-Content C:\TopazTest\TopazAZS.fdb "not a real database"
          function Setup($argList) {
            $p = Start-Process -FilePath $setup -ArgumentList $argList -Wait -PassThru
            Get-Content "$env:ProgramData\TopazAgent\logs\setup.log" -Tail 25 -ErrorAction SilentlyContinue | Write-Host
            return $p.ExitCode
          }
          # No Firebird and no server on the runner: installed with warnings (exit code 1).
          $code = Setup @('/S', '/station="CI Тест"', '/server=http://127.0.0.1:9', '/db=C:\TopazTest\TopazAZS.fdb')
          if ($code -ne 1) { throw "install exit code $code" }
          $svc = Get-Service TopazAgent
          if ($svc.Status -ne 'Running') { throw "service is $($svc.Status)" }
          $exe = "$env:ProgramFiles\TopazAgent\TopazAgent.exe"
          foreach ($f in @($exe, "$env:ProgramFiles\TopazAgent\datasets.json", "$env:ProgramFiles\TopazAgent\appsettings.json")) { if (-not (Test-Path $f)) { throw "missing $f" } }
          $settings = Get-Content "$env:ProgramFiles\TopazAgent\appsettings.json" -Raw | ConvertFrom-Json
          if ($settings.Station.Name -ne 'CI Тест') { throw "station name: $($settings.Station.Name)" }
          if ((Get-Content "$env:ProgramFiles\TopazAgent\appsettings.json" -Raw) -match 'electro') { throw "password leaked into appsettings.json" }
          $envVars = (Get-ItemProperty HKLM:\SYSTEM\CurrentControlSet\Services\TopazAgent -Name Environment).Environment
          if (-not ($envVars -contains 'TOPAZ_AGENT_Firebird__Password=electro')) { throw "service environment: $envVars" }
          $reg = Get-ItemProperty HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\TopazCenterAgent
          Write-Host "Programs and Features: $($reg.DisplayName) $($reg.DisplayVersion)"
          $acl = (icacls "$env:ProgramData\TopazAgent") -join "`n"
          if ($acl -match 'BUILTIN\\Users' -or $acl -notmatch 'NT AUTHORITY\\SYSTEM') { throw "state folder ACL: $acl" }
          Start-Sleep 15
          if ((Get-Service TopazAgent).Status -ne 'Running') { throw "service stopped after start" }
          Get-Content "$env:ProgramData\TopazAgent\logs\agent-*.log" -Tail 5

          # Update in place: the station name is kept.
          $code = Setup @('/S')
          if ($code -ne 1) { throw "update exit code $code" }
          $settings = Get-Content "$env:ProgramFiles\TopazAgent\appsettings.json" -Raw | ConvertFrom-Json
          if ($settings.Station.Name -ne 'CI Тест') { throw "update lost the station name" }

          # Uninstall continues from a temporary copy: wait until everything is gone.
          Start-Process -FilePath $exe -ArgumentList 'uninstall', '/S' -Wait
          for ($i = 0; $i -lt 60 -and ((Get-Service TopazAgent -ErrorAction SilentlyContinue) -or (Test-Path "$env:ProgramFiles\TopazAgent")); $i++) { Start-Sleep 1 }
          if (Get-Service TopazAgent -ErrorAction SilentlyContinue) { throw "service still there" }
          if (Test-Path "$env:ProgramFiles\TopazAgent") { throw "program folder still there" }
          if (Test-Path HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\TopazCenterAgent) { throw "Programs and Features entry still there" }
          Write-Host "install / update / uninstall OK"
      - name: Diagnostics
        if: failure()
        run: |
          sc.exe qc TopazAgent
          Get-ChildItem "$env:ProgramData\TopazAgent\logs" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "== $($_.Name)"; Get-Content $_.FullName -Tail 30 }
          Get-WinEvent -LogName Application -MaxEvents 15 -ErrorAction SilentlyContinue | Where-Object { $_.LevelDisplayName -in 'Error', 'Critical' } | Format-List TimeCreated, ProviderName, Message
          Get-WinEvent -LogName System -MaxEvents 30 -ErrorAction SilentlyContinue | Where-Object { $_.ProviderName -eq 'Service Control Manager' } | Format-List TimeCreated, Message
      - name: Pictures of the setup window
        run: |
          $setup = (Get-ChildItem setup\*.exe)[0].FullName
          Start-Process -FilePath $setup -ArgumentList 'setup-preview', "$PWD\previews" -Wait
          Get-ChildItem previews
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: setup-window-previews
          path: previews

  central-image:
    needs: [test, web, agent-package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Signed agent packages go into the image: agents update from their own server.
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-update-*
          merge-multiple: true
          path: agent-updates
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V=${GITHUB_REF_NAME#v}; else V=1.0.0-ci.${GITHUB_RUN_NUMBER}; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/topaz-central" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Topaz.Central/Dockerfile
          build-args: VERSION=${{ steps.meta.outputs.version }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, web, agent-version, agent-package, agent-windows, central-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-zip-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-update-*
          merge-multiple: true
          path: upd
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-setup-*
          merge-multiple: true
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          V=${GITHUB_REF_NAME#v}
          AV=${{ needs.agent-version.outputs.version }}
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/topaz-central:$V
          for m in upd/*/*/manifest.json; do
            RID=$(basename "$(dirname "$m")")
            cp "$m" "dist/TopazAgent-$AV-$RID.manifest.json"
            cp "$(dirname "$m")/manifest.sig" "dist/TopazAgent-$AV-$RID.manifest.sig"
          done
          if [[ "${{ needs.agent-version.outputs.rebuild }}" == "true" ]]; then
            AGENT_NOTE="- Уже установленные агенты (1.2+) обновятся сами с вашего сервера. \`*.zip\` и \`*.manifest.*\` — подписанные пакеты для автообновления, скачивать их не нужно."
          else
            AGENT_NOTE="- **Агент в этом выпуске не менялся** (версия $AV, как в ${{ needs.agent-version.outputs.from }}): обновление на АЗС не придёт. \`*.zip\` и \`*.manifest.*\` — подписанные пакеты для автообновления, скачивать их не нужно."
          fi
          cd dist
          sha256sum TopazAgent-Setup-*.exe TopazAgent-*.zip > SHA256SUMS.txt
          cat > notes.md <<EOF
          ## Агент АЗС (Windows)

          **Скачайте \`TopazAgent-Setup-$AV-win-x64.exe\`** (для 32-битной Windows — \`-win-x86\`), запустите двойным кликом и введите название АЗС. Всё остальное установщик сделает сам: найдёт базу Топаза, установит службу и покажет **код подтверждения**. Сообщите код администратору сервера — он подключит АЗС в «АЗС → Подключение».

          - .NET устанавливать не нужно; Windows 10/11 или Server 2016+, Windows 7 не поддерживается.
          - Файл без цифровой подписи Microsoft: если Windows покажет «Система Windows защитила ваш компьютер», нажмите «Подробнее» → «Выполнить в любом случае».
          - Тихая установка: \`TopazAgent-Setup-$AV-win-x64.exe /S /station="АЗС-5"\` (код — в \`%ProgramData%\TopazAgent\logs\setup.log\`).
          $AGENT_NOTE

          Подробно: [deploy/agent/README.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/deploy/agent/README.md). Контрольные суммы — в \`SHA256SUMS.txt\`.

          ## Сервер

          Образ: \`$IMAGE\` (\`CENTRAL_IMAGE=$IMAGE\` в \`.env\`, затем \`docker compose up -d\`).
          EOF
          FLAGS=(); [[ "$V" == *-* ]] && FLAGS+=(--prerelease)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" TopazAgent-* SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" TopazAgent-* SHA256SUMS.txt --verify-tag --title "Topaz Agent $V" \
              --notes-file notes.md --generate-notes "${FLAGS[@]}"
          fi
